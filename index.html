<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TableTap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <p class="logo"><span aria-hidden="true">🍽️</span> TableTap</p>
  </header>

  <main id="main">
    <h1 id="page-title">Welcome to TableTap</h1>

    <!-- "Who are you?" form. Shown the first time, or when changing your name. -->
    <section id="name-section" class="card" hidden>
      <form id="name-form">
        <label for="name-input">What's your name?</label>
        <p class="hint" id="name-hint">Your friends will see this in the notification.</p>
        <input id="name-input" type="text" autocomplete="given-name" maxlength="40"
               required aria-describedby="name-hint">
        <button type="submit" class="btn btn-primary">Save name</button>
      </form>
    </section>

    <!-- Notify section. Shown on tables and the entrance once we know your name. -->
    <section id="notify-section" class="card" hidden>
      <p class="greeting">Hi, <strong id="name-display"></strong>!
        <button type="button" id="change-name" class="btn-link">Change name</button>
      </p>
      <button type="button" id="notify-btn" class="btn btn-primary btn-big">Notify my friends</button>
    </section>

    <!-- Status messages. aria-live makes screen readers announce changes here. -->
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <!-- Entrance only: the list of tables with "Play directions" buttons. -->
    <section id="directions-section" hidden aria-labelledby="directions-heading">
      <h2 id="directions-heading">Directions to a table</h2>
      <p class="hint">Tap a button to hear walking directions from this entrance.</p>
      <ul id="table-list" class="table-list"></ul>
    </section>

    <!-- Shown when the URL has no ?loc= or one we don't know. -->
    <section id="unknown-section" class="card" hidden>
      <p>This tag isn't set up yet. Known locations:</p>
      <ul id="location-links"></ul>
    </section>
  </main>

  <!-- Order matters: settings first, then the app that uses them. -->
  <script src="locations.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
