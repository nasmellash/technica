<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b3261e">
  <title>TableTap</title>
  <!-- Friendly rounded font. If it can't load (no internet), a system font is used instead. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Red-and-white checkered "tablecloth" header -->
  <header class="site-header">
    <p class="logo"><span aria-hidden="true">🍽️</span> TableTap</p>
  </header>

  <main id="main">
    <!-- Big welcome area. The emoji changes per page type (see style.css). -->
    <section class="hero">
      <div class="hero-icon" aria-hidden="true"></div>
      <h1 id="page-title">Welcome to TableTap</h1>
      <p id="page-subtitle" class="subtitle"></p>
    </section>

    <!-- "Who are you?" form. Shown the first time, or when changing your name. -->
    <section id="name-section" class="card" hidden>
      <form id="name-form">
        <label for="name-input">What's your name?</label>
        <p class="hint" id="name-hint">Your friends will see this in the notification.</p>
        <input id="name-input" type="text" autocomplete="given-name" maxlength="40"
               required aria-describedby="name-hint" placeholder="e.g. Alex">
        <button type="submit" class="btn btn-primary">Save name</button>
      </form>
    </section>

    <!-- Notify section. Shown on tables and the entrance once we know your name. -->
    <section id="notify-section" class="card" hidden>
      <div class="greeting">
        <p>Hi, <strong id="name-display"></strong>! <span aria-hidden="true">👋</span></p>
        <button type="button" id="change-name" class="btn-link">Change name</button>
      </div>
      <button type="button" id="notify-btn" class="btn btn-primary btn-big">
        <span aria-hidden="true">🔔</span>
        <span id="notify-label">Notify my friends</span>
      </button>
    </section>

    <!-- Status messages. aria-live makes screen readers announce changes here. -->
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <!-- Entrance only: the list of tables with "Play directions" buttons. -->
    <section id="directions-section" hidden aria-labelledby="directions-heading">
      <h2 id="directions-heading">Directions to a table</h2>
      <p class="hint">Tap a table to hear walking directions from this entrance. Tap again to stop.</p>
      <ul id="table-list" class="table-list"></ul>
    </section>

    <!-- Shown when the URL has no ?loc= or one we don't know. -->
    <section id="unknown-section" class="card" hidden>
      <p>This tag isn't set up yet. Known locations:</p>
      <ul id="location-links" class="location-links"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <p>Tap any TableTap tag to get started.</p>
  </footer>

  <!-- Order matters: settings first, then the app that uses them. -->
  <script src="locations.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
